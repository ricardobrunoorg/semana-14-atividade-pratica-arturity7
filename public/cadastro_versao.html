<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Versão — Firefox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md fixed-top" id="mainNavbar">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img src="img/2019.png" alt="Logo Firefox" class="navbar-logo" />
          <span class="navbar-site-name">Firefox</span>
        </a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navLinks"
                aria-controls="navLinks" aria-expanded="false" aria-label="Menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navLinks">
          <ul class="navbar-nav gap-1 py-2 py-md-0">
            <li class="nav-item"><a class="nav-link" href="index.html#destaque">Destaques</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#versoes">Versões</a></li>
            <li class="nav-item"><a class="nav-link active" href="cadastro_versao.html">Cadastrar</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#sobre">Sobre</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main style="padding-top:80px;min-height:100vh;">
    <div class="container py-5">

      <a href="index.html" class="btn-voltar mb-4 d-inline-flex align-items-center gap-2">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>

      <h2 class="section-title mb-4">
        <span class="title-pill">Cadastrar Nova Versão</span>
      </h2>

      <div id="alertaBox"></div>

      <div class="detalhe-card">
        <div id="formVersao">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label class="form-label-custom" for="inputNome">Nome da versão</label>
              <input type="text" id="inputNome" class="input-custom form-control"
                     placeholder="Ex: Firefox 57 — Quantum" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label-custom" for="inputVersao">Número da versão</label>
              <input type="text" id="inputVersao" class="input-custom form-control"
                     placeholder="Ex: 57.0" />
            </div>

            <div class="col-12">
              <label class="form-label-custom" for="inputDescCurta">Descrição curta</label>
              <input type="text" id="inputDescCurta" class="input-custom form-control"
                     placeholder="Resumo em uma frase (aparece nos cards)" />
            </div>

            <div class="col-12">
              <label class="form-label-custom" for="inputDescCompleta">Descrição completa</label>
              <textarea id="inputDescCompleta" class="input-custom form-control" rows="4"
                        placeholder="Texto detalhado que aparece na página de detalhes"></textarea>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label-custom" for="inputCategoria">Categoria</label>
              <select id="inputCategoria" class="input-custom form-select">
                <option value="">Selecione...</option>
                <option value="Performance">Performance</option>
                <option value="Privacidade">Privacidade</option>
                <option value="Design">Design</option>
                <option value="Multimídia">Multimídia</option>
                <option value="Corporativo">Corporativo</option>
                <option value="Histórico">Histórico</option>
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label-custom" for="inputLancamento">Data de lançamento</label>
              <input type="date" id="inputLancamento" class="input-custom form-control" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label-custom" for="inputImagem">Caminho da imagem</label>
              <input type="text" id="inputImagem" class="input-custom form-control"
                     placeholder="Ex: img/2019.png" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label-custom" for="inputCor">Cor de destaque</label>
              <div class="d-flex gap-2 align-items-center">
                <input type="color" id="inputCorPicker" value="#ff7139"
                       class="input-custom form-control form-control-color" style="width:52px;height:42px;padding:4px" />
                <input type="text" id="inputCor" class="input-custom form-control"
                       value="#ff7139" placeholder="#ff7139" />
              </div>
            </div>

            <div class="col-12">
              <label class="form-label-custom" for="inputTags">Tags (separadas por vírgula)</label>
              <input type="text" id="inputTags" class="input-custom form-control"
                     placeholder="Ex: quantum, performance, rust" />
            </div>

            <div class="col-12">
              <label class="form-label-custom">Versão em destaque?</label>
              <div class="d-flex gap-3 mt-1">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="destaque" id="destaqueNao" value="false" checked />
                  <label class="form-check-label" for="destaqueNao" style="color:var(--text-sub)">Não</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="destaque" id="destaqueSim" value="true" />
                  <label class="form-check-label" for="destaqueSim" style="color:var(--text-sub)">Sim</label>
                </div>
              </div>
            </div>

          </div>

          <div class="d-flex gap-3 mt-4">
            <button id="btnSalvar" class="btn-ver-mais">
              <i class="bi bi-floppy-fill"></i> Salvar versão
            </button>
            <button id="btnLimpar" class="btn-voltar d-inline-flex align-items-center gap-2">
              <i class="bi bi-arrow-counterclockwise"></i> Limpar
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="container">
      <hr class="footer-hr" />
      <p class="footer-copy text-center mb-0">© 2025 Mozilla Foundation</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="cadastro_versao.js"></script>
</body>
</html>
